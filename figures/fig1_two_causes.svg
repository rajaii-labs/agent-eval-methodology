<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 624 296" width="624" height="296" role="img" aria-labelledby="t d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" style="font-kerning:normal;font-variant-numeric:tabular-nums"><title id="t">Figure 1. One false sentence, two causes</title><desc id="d">In May 2026 the agent asserted that a business engagement was still pending; it had been declined days earlier. Two defects worked together. The conversation of the day the engagement was declined ran about 142,000 characters, and an 80,000-character cap in the ingestion pipeline silently discarded about 62,000 from the middle, the stretch with the decline, so the memory of the change never formed (class 5). The fact row still said &quot;in final stages&quot;, because nothing coupled the change in the world to the store (class 2). Both memories agreed on the wrong answer, and both reached the agent&#x27;s sentence.</desc><rect width="624" height="296" fill="#FFFFFF"/><defs><marker id="ah-slate" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.6,1.2 L9,5 L0.6,8.8 L2.6,5 Z" fill="#4A5162"/></marker><marker id="ah-mute" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.6,1.2 L9,5 L0.6,8.8 L2.6,5 Z" fill="#7D8494"/></marker><marker id="ah-checker" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.6,1.2 L9,5 L0.6,8.8 L2.6,5 Z" fill="#C8216A"/></marker><marker id="ah-agent" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.6,1.2 L9,5 L0.6,8.8 L2.6,5 Z" fill="#4B2BD4"/></marker><marker id="ah-me" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.6,1.2 L9,5 L0.6,8.8 L2.6,5 Z" fill="#D9622B"/></marker></defs><rect x="6.0" y="111.0" width="132.0" height="76.0" rx="7" ry="7" fill="#FFFFFF" stroke="#D7DAE1" stroke-width="1"/><rect x="6.5" y="120.0" width="3" height="58" rx="1.5" fill="#D9622B"/><text x="19.0" y="129.0" font-size="8" fill="#D9622B" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.08em">THE WORLD</text><text x="19.0" y="145.0" font-size="10.2" fill="#15171D" font-weight="450" text-anchor="start">the business</text><text x="19.0" y="158.3" font-size="10.2" fill="#15171D" font-weight="450" text-anchor="start">engagement was</text><text x="19.0" y="171.5" font-size="10.2" fill="#15171D" font-weight="450" text-anchor="start">declined, days earlier</text><text x="196.0" y="30.0" font-size="9.6" fill="#15171D" font-weight="500" text-anchor="start">the conversation of the day it was declined</text><text x="196.0" y="43.0" font-size="8" fill="#7D8494" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.06em">ABOUT 142,000 CHARACTERS</text><rect x="196.0" y="52" width="69.9" height="20" rx="2" fill="#D7DAE1"/><rect x="374.1" y="52" width="69.9" height="20" rx="2" fill="#D7DAE1"/><rect x="265.9" y="52.0" width="108.3" height="20.0" rx="2" ry="2" fill="#FFFFFF" stroke="#C8216A" stroke-width="1.2" stroke-dasharray="3 2.4"/><text x="320.0" y="65.4" font-size="8.6" fill="#C8216A" font-weight="600" text-anchor="middle">discarded</text><text x="230.9" y="85.0" font-size="8.6" fill="#4A5162" font-weight="400" text-anchor="middle">kept</text><text x="409.1" y="85.0" font-size="8.6" fill="#4A5162" font-weight="400" text-anchor="middle">kept</text><text x="320.0" y="85.0" font-size="8.6" fill="#C8216A" font-weight="500" text-anchor="middle">about 62,000 from the middle,</text><text x="320.0" y="95.8" font-size="8.6" fill="#C8216A" font-weight="500" text-anchor="middle">the stretch with the decline</text><text x="196.0" y="118.0" font-size="8.6" fill="#4A5162" font-weight="400" text-anchor="start">an 80,000‐character cap in the ingestion</text><text x="196.0" y="128.8" font-size="8.6" fill="#4A5162" font-weight="400" text-anchor="start">pipeline kept the start and the end</text><path d="M124,111 C128,62 156,62.0 188,62.0" fill="none" stroke="#4A5162" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-slate)"/><rect x="474.0" y="31.0" width="144.0" height="62.0" rx="7" ry="7" fill="#FFFFFF" stroke="#C8216A" stroke-width="1.15" stroke-dasharray="4 3"/><rect x="474.5" y="40.0" width="3" height="44" rx="1.5" fill="#C8216A"/><text x="487.0" y="49.0" font-size="8" fill="#C8216A" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.08em">MEMORY · CLASS 5</text><text x="487.0" y="65.0" font-size="10.2" fill="#15171D" font-weight="450" text-anchor="start">the memory of the</text><text x="487.0" y="78.3" font-size="10.2" fill="#15171D" font-weight="450" text-anchor="start">change never formed</text><line x1="450.0" y1="62.0" x2="466.0" y2="62.0" stroke="#4A5162" stroke-width="1.1" stroke-linecap="round" marker-end="url(#ah-slate)"/><rect x="196.0" y="208.0" width="170.0" height="62.0" rx="7" ry="7" fill="#FFFFFF" stroke="#C8216A" stroke-width="1.15"/><rect x="196.5" y="217.0" width="3" height="44" rx="1.5" fill="#C8216A"/><text x="209.0" y="226.0" font-size="8" fill="#C8216A" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.08em">FACT ROW · CLASS 2</text><text x="209.0" y="242.0" font-size="10.2" fill="#15171D" font-weight="450" text-anchor="start">still said</text><text x="209.0" y="255.3" font-size="10.2" fill="#15171D" font-weight="450" text-anchor="start">&quot;in final stages&quot;</text><path d="M124,187 C128,239.0 156,239.0 188,239.0" fill="none" stroke="#7D8494" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="2 3"/><text x="10.0" y="227.0" font-size="8.6" fill="#4A5162" font-weight="400" text-anchor="start">nothing coupled the change</text><text x="10.0" y="237.8" font-size="8.6" fill="#4A5162" font-weight="400" text-anchor="start">in the world to the store</text><rect x="452.0" y="178.0" width="166.0" height="74.0" rx="7" ry="7" fill="#FFFFFF" stroke="#D7DAE1" stroke-width="1"/><rect x="452.5" y="187.0" width="3" height="56" rx="1.5" fill="#4B2BD4"/><text x="465.0" y="196.0" font-size="8" fill="#4B2BD4" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.08em">THE AGENT · MAY 2026</text><text x="465.0" y="212.0" font-size="10.2" fill="#15171D" font-weight="450" text-anchor="start">asserts the engagement</text><text x="465.0" y="225.3" font-size="10.2" fill="#15171D" font-weight="450" text-anchor="start">is still pending,</text><text x="465.0" y="238.5" font-size="10.2" fill="#15171D" font-weight="450" text-anchor="start">with invented detail</text><line x1="546.0" y1="99.0" x2="546.0" y2="169.0" stroke="#C8216A" stroke-width="1.15" stroke-linecap="round" marker-end="url(#ah-checker)"/><line x1="372.0" y1="239.0" x2="443.0" y2="239.0" stroke="#C8216A" stroke-width="1.15" stroke-linecap="round" marker-end="url(#ah-checker)"/><text x="454.0" y="269.0" font-size="8.6" fill="#15171D" font-weight="500" text-anchor="start">both memories agreed</text><text x="454.0" y="279.8" font-size="8.6" fill="#15171D" font-weight="500" text-anchor="start">on the wrong answer</text></svg>