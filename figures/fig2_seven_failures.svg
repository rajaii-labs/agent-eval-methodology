<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 624 374" width="624" height="374" role="img" aria-labelledby="t d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" style="font-kerning:normal;font-variant-numeric:tabular-nums"><title id="t">Figure 2. Seven failures, one symptom</title><desc id="d">The seven failure classes of Table 1, in three columns by the layer that fails: model behavior (1 open-set fabrication, 2 stale-state assertion, 3 negation violation, 4 verbatim-quote confabulation), data pipeline (5 ingestion-induced blindness) and system (6 register drift, 7 format leakage), each with its surface signature; classes 2 and 5, the two behind the false sentence of May 2026, are outlined. All three columns arrive at one box: what the user sees, the agent is wrong.</desc><rect width="624" height="374" fill="#FFFFFF"/><defs><marker id="ah-slate" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.6,1.2 L9,5 L0.6,8.8 L2.6,5 Z" fill="#4A5162"/></marker><marker id="ah-mute" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.6,1.2 L9,5 L0.6,8.8 L2.6,5 Z" fill="#7D8494"/></marker><marker id="ah-checker" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.6,1.2 L9,5 L0.6,8.8 L2.6,5 Z" fill="#C8216A"/></marker><marker id="ah-agent" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.6,1.2 L9,5 L0.6,8.8 L2.6,5 Z" fill="#4B2BD4"/></marker><marker id="ah-me" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.6,1.2 L9,5 L0.6,8.8 L2.6,5 Z" fill="#D9622B"/></marker></defs><text x="8.0" y="22.0" font-size="8.2" fill="#4B2BD4" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.12em">MODEL BEHAVIOR</text><line x1="8.0" y1="29.0" x2="200.0" y2="29.0" stroke="#4B2BD4" stroke-width="1.2" stroke-linecap="round"/><rect x="6.0" y="40.0" width="196.0" height="42.0" rx="7" ry="7" fill="#FFFFFF" stroke="#D7DAE1" stroke-width="1"/><rect x="6.5" y="48.0" width="3" height="26" rx="1.5" fill="#C8216A"/><text x="19.0" y="58.0" font-size="10.2" fill="#C8216A" font-weight="600" text-anchor="start">1</text><text x="30.3" y="58.0" font-size="10.2" fill="#15171D" font-weight="600" text-anchor="start">Open‐set fabrication</text><text x="19.0" y="72.0" font-size="8.8" fill="#4A5162" font-weight="400" text-anchor="start">Confident, specific, unverifiable detail</text><rect x="6.0" y="90.0" width="196.0" height="54.0" rx="7" ry="7" fill="#FFFFFF" stroke="#C8216A" stroke-width="1.4"/><rect x="6.5" y="98.0" width="3" height="38" rx="1.5" fill="#C8216A"/><text x="19.0" y="108.0" font-size="10.2" fill="#C8216A" font-weight="600" text-anchor="start">2</text><text x="32.4" y="108.0" font-size="10.2" fill="#15171D" font-weight="600" text-anchor="start">Stale‐state assertion</text><text x="19.0" y="122.0" font-size="8.8" fill="#4A5162" font-weight="400" text-anchor="start">High confidence + outdated supporting</text><text x="19.0" y="133.4" font-size="8.8" fill="#4A5162" font-weight="400" text-anchor="start">detail</text><rect x="6.0" y="152.0" width="196.0" height="42.0" rx="7" ry="7" fill="#FFFFFF" stroke="#D7DAE1" stroke-width="1"/><rect x="6.5" y="160.0" width="3" height="26" rx="1.5" fill="#C8216A"/><text x="19.0" y="170.0" font-size="10.2" fill="#C8216A" font-weight="600" text-anchor="start">3</text><text x="32.5" y="170.0" font-size="10.2" fill="#15171D" font-weight="600" text-anchor="start">Negation violation</text><text x="19.0" y="184.0" font-size="8.8" fill="#4A5162" font-weight="400" text-anchor="start">Direct contradiction of a stored negation</text><rect x="6.0" y="202.0" width="196.0" height="54.0" rx="7" ry="7" fill="#FFFFFF" stroke="#D7DAE1" stroke-width="1"/><rect x="6.5" y="210.0" width="3" height="38" rx="1.5" fill="#C8216A"/><text x="19.0" y="220.0" font-size="10.2" fill="#C8216A" font-weight="600" text-anchor="start">4</text><text x="32.8" y="220.0" font-size="10.2" fill="#15171D" font-weight="600" text-anchor="start">Verbatim‐quote confabulation</text><text x="19.0" y="234.0" font-size="8.8" fill="#4A5162" font-weight="400" text-anchor="start">Quotation marks around</text><text x="19.0" y="245.4" font-size="8.8" fill="#4A5162" font-weight="400" text-anchor="start">unreconstructable text</text><text x="216.0" y="22.0" font-size="8.2" fill="#5D6577" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.12em">DATA PIPELINE</text><line x1="216.0" y1="29.0" x2="408.0" y2="29.0" stroke="#5D6577" stroke-width="1.2" stroke-linecap="round"/><rect x="214.0" y="40.0" width="196.0" height="42.0" rx="7" ry="7" fill="#FFFFFF" stroke="#C8216A" stroke-width="1.4"/><rect x="214.5" y="48.0" width="3" height="26" rx="1.5" fill="#C8216A"/><text x="227.0" y="58.0" font-size="10.2" fill="#C8216A" font-weight="600" text-anchor="start">5</text><text x="240.4" y="58.0" font-size="10.2" fill="#15171D" font-weight="600" text-anchor="start">Ingestion‐induced blindness</text><text x="227.0" y="72.0" font-size="8.8" fill="#4A5162" font-weight="400" text-anchor="start">Identical to classes 1–2 at the surface</text><text x="424.0" y="22.0" font-size="8.2" fill="#5D6577" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.12em">SYSTEM</text><line x1="424.0" y1="29.0" x2="616.0" y2="29.0" stroke="#5D6577" stroke-width="1.2" stroke-linecap="round"/><rect x="422.0" y="40.0" width="196.0" height="54.0" rx="7" ry="7" fill="#FFFFFF" stroke="#D7DAE1" stroke-width="1"/><rect x="422.5" y="48.0" width="3" height="38" rx="1.5" fill="#C8216A"/><text x="435.0" y="58.0" font-size="10.2" fill="#C8216A" font-weight="600" text-anchor="start">6</text><text x="448.6" y="58.0" font-size="10.2" fill="#15171D" font-weight="600" text-anchor="start">Register drift</text><text x="435.0" y="72.0" font-size="8.8" fill="#4A5162" font-weight="400" text-anchor="start">Invisible turn‐to‐turn; obvious</text><text x="435.0" y="83.4" font-size="8.8" fill="#4A5162" font-weight="400" text-anchor="start">month‐over‐month</text><rect x="422.0" y="102.0" width="196.0" height="42.0" rx="7" ry="7" fill="#FFFFFF" stroke="#D7DAE1" stroke-width="1"/><rect x="422.5" y="110.0" width="3" height="26" rx="1.5" fill="#C8216A"/><text x="435.0" y="120.0" font-size="10.2" fill="#C8216A" font-weight="600" text-anchor="start">7</text><text x="447.9" y="120.0" font-size="10.2" fill="#15171D" font-weight="600" text-anchor="start">Format leakage</text><text x="435.0" y="134.0" font-size="8.8" fill="#4A5162" font-weight="400" text-anchor="start">Mechanical, immediately visible</text><path d="M104.0,262.0 C104.0,282.0 312.0,274.0 312.0,292.0" fill="none" stroke="#C8216A" stroke-width="1.15" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-checker)"/><path d="M312.0,88.0 V292.0" fill="none" stroke="#C8216A" stroke-width="1.15" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-checker)"/><path d="M520.0,150.0 C520.0,170.0 312.0,274.0 312.0,292.0" fill="none" stroke="#C8216A" stroke-width="1.15" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-checker)"/><rect x="120.0" y="300.0" width="384.0" height="56.0" rx="8" ry="8" fill="#FFFFFF" stroke="#D9622B" stroke-width="1.3"/><rect x="8.0" y="308.0" width="22.0" height="14.0" rx="4" ry="4" fill="#FFFFFF" stroke="#C8216A" stroke-width="1.4"/><text x="8.0" y="337.0" font-size="8.4" fill="#4A5162" font-weight="400" text-anchor="start">outlined: the two</text><text x="8.0" y="347.5" font-size="8.4" fill="#4A5162" font-weight="400" text-anchor="start">classes behind the</text><text x="8.0" y="358.0" font-size="8.4" fill="#4A5162" font-weight="400" text-anchor="start">false sentence of</text><text x="8.0" y="368.5" font-size="8.4" fill="#4A5162" font-weight="400" text-anchor="start">May 2026</text><text x="312.0" y="320.0" font-size="8.2" fill="#D9622B" font-weight="500" text-anchor="middle" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.12em">WHAT THE USER SEES</text><text x="312.0" y="341.0" font-size="13" fill="#15171D" font-weight="600" text-anchor="middle">&quot;the agent is wrong&quot;</text></svg>