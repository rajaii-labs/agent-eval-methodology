<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 624 385" width="624" height="385" role="img" aria-labelledby="t d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" style="font-kerning:normal;font-variant-numeric:tabular-nums"><title id="t">Figure 3. The honesty stack, in the order it was built</title><desc id="d">Six layers, top to bottom in the order they were built, each with what it does or catches: 1, a written standard in the prompt, which catches an answer invented where no store has one; 2, facts that record what is false, which catch an affirmation of what is stored as false; 3, a check at generation time, which catches a draft that contradicts a stored negation; 4, a memory of caught fabrications, which catches a paraphrase of a fabrication already caught; 5, removing the one bad sentence, which catches the one sentence that fails verification; 6, a read-only query tool, which catches a checkable claim made from memory: the agent looks it up, or it says it cannot. An arc on the left runs from instructions through data to lookup.</desc><rect width="624" height="385" fill="#FFFFFF"/><defs><marker id="ah-slate" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.6,1.2 L9,5 L0.6,8.8 L2.6,5 Z" fill="#4A5162"/></marker><marker id="ah-mute" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.6,1.2 L9,5 L0.6,8.8 L2.6,5 Z" fill="#7D8494"/></marker><marker id="ah-checker" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.6,1.2 L9,5 L0.6,8.8 L2.6,5 Z" fill="#C8216A"/></marker><marker id="ah-agent" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.6,1.2 L9,5 L0.6,8.8 L2.6,5 Z" fill="#4B2BD4"/></marker><marker id="ah-me" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.6,1.2 L9,5 L0.6,8.8 L2.6,5 Z" fill="#D9622B"/></marker></defs><text x="282.0" y="16.0" font-size="8" fill="#7D8494" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.1em">WHAT IT IS BUILT TO CATCH</text><text x="109.0" y="16.0" font-size="8" fill="#7D8494" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.1em">LAYER, IN THE ORDER BUILT</text><rect x="96.0" y="26.0" width="528.0" height="58.0" rx="7" ry="7" fill="#FFFFFF" stroke="#D7DAE1" stroke-width="1"/><rect x="96.5" y="34.0" width="3" height="42" rx="1.5" fill="#5D6577"/><text x="109.0" y="42.0" font-size="8" fill="#5D6577" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.08em">1 · INSTRUCTION</text><text x="109.0" y="57.0" font-size="10.6" fill="#15171D" font-weight="600" text-anchor="start">A written standard in the</text><text x="109.0" y="70.2" font-size="10.6" fill="#15171D" font-weight="600" text-anchor="start">prompt</text><text x="282.0" y="45.0" font-size="9.0" fill="#4A5162" font-weight="400" text-anchor="start">an answer invented where no store has one</text><rect x="96.0" y="92.0" width="528.0" height="45.0" rx="7" ry="7" fill="#FFFFFF" stroke="#D7DAE1" stroke-width="1"/><rect x="96.5" y="100.0" width="3" height="29" rx="1.5" fill="#5D6577"/><text x="109.0" y="108.0" font-size="8" fill="#5D6577" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.08em">2 · DATA</text><text x="109.0" y="123.0" font-size="10.6" fill="#15171D" font-weight="600" text-anchor="start">Facts that record what is false</text><text x="282.0" y="111.0" font-size="9.0" fill="#4A5162" font-weight="400" text-anchor="start">an affirmation of what is stored as false</text><rect x="96.0" y="145.0" width="528.0" height="45.0" rx="7" ry="7" fill="#FFFFFF" stroke="#D7DAE1" stroke-width="1"/><rect x="96.5" y="153.0" width="3" height="29" rx="1.5" fill="#C8216A"/><text x="109.0" y="161.0" font-size="8" fill="#C8216A" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.08em">3 · CHECK</text><text x="109.0" y="176.0" font-size="10.6" fill="#15171D" font-weight="600" text-anchor="start">A check at generation time</text><text x="282.0" y="164.0" font-size="9.0" fill="#4A5162" font-weight="400" text-anchor="start">a draft that contradicts a stored negation</text><rect x="96.0" y="198.0" width="528.0" height="58.0" rx="7" ry="7" fill="#FFFFFF" stroke="#D7DAE1" stroke-width="1"/><rect x="96.5" y="206.0" width="3" height="42" rx="1.5" fill="#C8216A"/><text x="109.0" y="214.0" font-size="8" fill="#C8216A" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.08em">4 · CHECK</text><text x="109.0" y="229.0" font-size="10.6" fill="#15171D" font-weight="600" text-anchor="start">A memory of caught</text><text x="109.0" y="242.2" font-size="10.6" fill="#15171D" font-weight="600" text-anchor="start">fabrications</text><text x="282.0" y="217.0" font-size="9.0" fill="#4A5162" font-weight="400" text-anchor="start">a paraphrase of a fabrication already caught</text><rect x="96.0" y="264.0" width="528.0" height="58.0" rx="7" ry="7" fill="#FFFFFF" stroke="#D7DAE1" stroke-width="1"/><rect x="96.5" y="272.0" width="3" height="42" rx="1.5" fill="#C8216A"/><text x="109.0" y="280.0" font-size="8" fill="#C8216A" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.08em">5 · CHECK</text><text x="109.0" y="295.0" font-size="10.6" fill="#15171D" font-weight="600" text-anchor="start">Removing the one bad</text><text x="109.0" y="308.2" font-size="10.6" fill="#15171D" font-weight="600" text-anchor="start">sentence</text><text x="282.0" y="283.0" font-size="9.0" fill="#4A5162" font-weight="400" text-anchor="start">the one sentence that fails verification</text><rect x="96.0" y="330.0" width="528.0" height="45.0" rx="7" ry="7" fill="#FFFFFF" stroke="#D7DAE1" stroke-width="1"/><rect x="96.5" y="338.0" width="3" height="29" rx="1.5" fill="#4B2BD4"/><text x="109.0" y="346.0" font-size="8" fill="#4B2BD4" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.08em">6 · LOOKUP</text><text x="109.0" y="361.0" font-size="10.6" fill="#15171D" font-weight="600" text-anchor="start">A read‐only query tool</text><text x="282.0" y="349.0" font-size="9.0" fill="#4A5162" font-weight="400" text-anchor="start">a checkable claim made from memory: it looks it up, or it says it cannot</text><line x1="84.0" y1="55.0" x2="84.0" y2="344.5" stroke="#4A5162" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ah-slate)"/><circle cx="84" cy="55.0" r="3.2" fill="#FFFFFF" stroke="#5D6577" stroke-width="1.4"/><text x="76.0" y="58.2" font-size="8.6" fill="#5D6577" font-weight="500" text-anchor="end">instructions</text><circle cx="84" cy="114.5" r="3.2" fill="#FFFFFF" stroke="#5D6577" stroke-width="1.4"/><text x="76.0" y="117.7" font-size="8.6" fill="#5D6577" font-weight="500" text-anchor="end">data</text><circle cx="84" cy="352.5" r="3.4" fill="#4B2BD4"/><text x="76.0" y="355.7" font-size="8.6" fill="#4B2BD4" font-weight="500" text-anchor="end">lookup</text></svg>